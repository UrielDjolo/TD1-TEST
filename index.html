<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Validation JS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <main class="container">

        <header class="header">
            <div class="logo">FV</div>

            <h1>Create Account</h1>

            <p>
                Créez votre compte en quelques secondes
            </p>
        </header>


        <form class="form" id="form">

            <div class="form-control">
                <label for="fullName">Nom complet</label>

                <input type="text" id="fullName" placeholder="Entrez votre nom complet">

                <small></small>
            </div>


            <div class="form-control">
                <label for="age">Âge</label>

                <input type="number" id="age" placeholder="Entrez votre âge">

                <small></small>
            </div>


            <div class="form-control">
                <label for="email">Adresse email</label>

                <input type="email" id="email" placeholder="exemple@email.com">

                <small></small>
            </div>


            <div class="form-control">
                <label for="gender">Genre</label>

                <select id="gender">

                    <option value="default">
                        Sélectionnez votre genre
                    </option>

                    <option value="male">
                        Homme
                    </option>

                    <option value="female">
                        Femme
                    </option>

                </select>

                <small></small>
            </div>


            <div class="form-control">
                <label for="phoneNumber">
                    Numéro de téléphone
                </label>

                <input type="tel" id="phoneNumber" placeholder="0707070707">

                <small></small>
            </div>


            <div class="form-control">
                <label for="password">
                    Mot de passe
                </label>

                <input type="password" id="password" placeholder="Minimum 8 caractères">

                <small></small>
            </div>


            <div class="form-control">
                <label for="checkPassword">
                    Confirmation du mot de passe
                </label>

                <input type="password" id="checkPassword" placeholder="Confirmez votre mot de passe">

                <small></small>
            </div>


            <button type="submit" id="submit">

                <span>Créer mon compte</span>

                <span class="arrow">→</span>

            </button>


            <div id="successMessage" class="success-message">
                Compte créé avec succès.
            </div>

        </form>

    </main>


    <script src="script.js"></script>

</body>

</html>
